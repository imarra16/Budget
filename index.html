<style>
:root{
  --ink:#241B3D; --soft:#6B6288; --bg:#F1EDF9; --surface:#fff; --line:#E6DEF5;
  --reste:#4F3FF0; --in:#12B76A; --out:#E23E6B; --rec:#9333EA; --four:#FF8A3D; --goal:#F5B301;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
#vue{flex:1;overflow-y:auto;padding:18px 16px 100px;-webkit-overflow-scrolling:touch}
#vue::-webkit-scrollbar{width:0}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.titre{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:2px 0 16px}
.carte{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(36,27,61,.06),0 8px 24px -16px rgba(36,27,61,.35)}
.gros{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin:4px 0 2px;color:var(--reste)}
.negatif{color:var(--out)}
.sous{font-size:13px;color:var(--soft);line-height:1.45}
.jauge{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--bg);gap:2px}
.jauge>div{transition:width .5s cubic-bezier(.22,1,.36,1)}
.leg{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:9px}
.pastille{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chiffre{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:6px 0 1px}
.ligne{display:flex;align-items:center;gap:11px;padding:10px 8px}
.ligne .txt{flex:1;min-width:0}
.ligne .nom{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .det{font-size:12.5px;color:var(--soft);margin-top:1px}
.ico{border-radius:10px;padding:7px;line-height:0;flex:0 0 auto}
.vide{text-align:center;padding:26px 10px;color:var(--soft);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
button:active{transform:scale(.97);filter:brightness(.94)}
button:focus-visible{outline:2.5px solid var(--reste);outline-offset:2px}
.btn{border:none;color:#fff;font-weight:700;font-size:15px;padding:13px 18px;border-radius:14px;
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--reste)}
.btn.creux{background:transparent;border:1.5px solid var(--reste);color:var(--reste)}
.mini{border:none;color:#fff;border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700}
.puce{border:1.5px solid var(--line);background:#FBFAFE;border-radius:11px;padding:9px 13px;
  font-size:14px;font-weight:700;color:var(--ink)}
.corbeille{border:none;background:none;padding:2px;line-height:0;color:var(--line)}
.champ{display:block;margin-bottom:12px}
.champ input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:16px;color:var(--ink);font-family:inherit;background:#FBFAFE;outline:none}
.champ input:focus{border-color:var(--reste)}
.barreobj{height:12px;background:#F0EBFA;border-radius:99px;overflow:hidden}
.barreobj>div{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.tranches{display:flex;gap:5px;margin:14px 0 12px}
.tranches>div{flex:1;height:9px;border-radius:99px;background:#F0EBFA;transition:background .3s}
#graph{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
#graph .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
#graph .paire{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
#graph .paire i{width:42%;border-radius:5px 5px 0 0;min-height:2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
#graph .m{font-size:11px;color:var(--soft)}
#plus{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;
  border-radius:20px;background:var(--reste);border:none;color:#fff;z-index:20;
  box-shadow:0 10px 24px -8px rgba(79,63,240,.75);display:grid;place-items:center}
nav{background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:8px 4px calc(12px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;border:none;background:none;padding:6px 0;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--soft);font-size:11px;font-weight:600}
nav button.on{color:var(--reste);font-weight:800}
#voile{position:fixed;inset:0;background:rgba(36,27,61,.45);display:none;align-items:flex-end;z-index:50}
#voile.on{display:flex}
#feuille{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:up .26s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tete h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.fermer{border:none;background:var(--bg);border-radius:10px;padding:7px;line-height:0;color:var(--soft)}
.fade{animation:f .22s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.alerte{margin-top:14px;background:#FEF0F4;color:var(--out);border-radius:12px;padding:10px 12px;
  font-size:13px;font-weight:600;line-height:1.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="vue"></div>
<button id="plus" aria-label="Ajouter une opération" onclick="ouvrir('op')">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav id="nav"></nav>

<div id="voile" onclick="if(event.target===this)fermer()"><div id="feuille"></div></div>

<script>
/* ------------------------------------------------ constantes */
const MOIS=['janv.','févr.','mars','avril','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const COUL=['#4F3FF0','#00B8D9','#12B76A','#E23E6B','#FF8A3D','#9333EA'];
const CLE='budget-v1';

const VIDE={comptes:[
  {id:'c1',nom:'Compte courant',couleur:'#4F3FF0',soldeInitial:0},
  {id:'c2',nom:'Livret épargne',couleur:'#00B8D9',soldeInitial:0}],
  ops:[],recs:[],fours:[],goals:[]};

/* ------------------------------------------------ outils */
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const eurC=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const uid=()=>Math.random().toString(36).slice(2,10);
const cleMois=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const auj=()=>new Date().toISOString().slice(0,10);
const jolie=iso=>{const d=new Date(iso+'T12:00:00');return d.getDate()+' '+MOIS[d.getMonth()];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb=v=>parseFloat(String(v).replace(',','.'))||0;

const SVG={
  bas:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M17 17H7V7"/></svg>',
  haut:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>',
  boucle:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  poubelle:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  croix:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  gauche:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  droite:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  plus:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  maison:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  portefeuille:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M17 13h.01"/></svg>',
  boucleNav:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  cible:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>'
};

/* ------------------------------------------------ état */
let D=structuredClone(VIDE), tab='accueil', dec=0;

function charger(){
  try{const b=localStorage.getItem(CLE); if(b) D=Object.assign(structuredClone(VIDE),JSON.parse(b));}
  catch(e){}
}
function sauver(){ try{localStorage.setItem(CLE,JSON.stringify(D));}catch(e){} }
function maj(){ sauver(); rendre(); }

/* ------------------------------------------------ calculs */
const soldeDe=c=>c.soldeInitial+D.ops.filter(o=>o.compteId===c.id)
  .reduce((s,o)=>s+(o.type==='in'?o.montant:-o.montant),0);
const soldeTotal=()=>D.comptes.reduce((s,c)=>s+soldeDe(c),0);
const moisCourant=()=>cleMois(new Date());
function moisVu(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+dec);return d;}

function calc(){
  const mv=cleMois(moisVu()), mc=moisCourant();
  const om=D.ops.filter(o=>o.date.slice(0,7)===mv);
  const recsDus=D.recs.filter(r=>r.dernierMois!==mc);
  const actifs=D.fours.filter(f=>f.payees<f.nb);
  const foursDus=actifs.filter(f=>f.dernierMois!==mc);
  const mRec=recsDus.reduce((s,r)=>s+r.montant,0);
  const mFour=foursDus.reduce((s,f)=>s+f.total/f.nb,0);
  const epargne=D.goals.reduce((s,g)=>s+g.epargne,0);
  const total=soldeTotal();
  return{
    mv,mc,
    entrees:om.filter(o=>o.type==='in').sort((a,b)=>b.date.localeCompare(a.date)),
    totalIn:om.filter(o=>o.type==='in').reduce((s,o)=>s+o.montant,0),
    totalOut:om.filter(o=>o.type==='out').reduce((s,o)=>s+o.montant,0),
    mRec,mFour,epargne,total,
    reste4x:actifs.reduce((s,f)=>s+(f.nb-f.payees)*(f.total/f.nb),0),
    resteAVivre:total-mRec-mFour-epargne
  };
}
const rienDedans=()=>!D.ops.length&&!D.recs.length&&!D.fours.length&&!D.goals.length
  &&D.comptes.every(c=>c.soldeInitial===0);

/* ------------------------------------------------ actions */
function allerA(t){tab=t;document.getElementById('vue').scrollTop=0;rendre();}
function moisPrec(){dec--;rendre();}
function moisSuiv(){if(dec<0){dec++;rendre();}}
function supprimer(cle,id){D[cle]=D[cle].filter(x=>x.id!==id);maj();}

function payerRec(id){
  const r=D.recs.find(x=>x.id===id); if(!r)return;
  r.dernierMois=moisCourant();
  D.ops.unshift({id:uid(),type:'out',montant:r.montant,libelle:r.libelle,compteId:r.compteId,date:auj()});
  maj();
}
function payerEch(id){
  const f=D.fours.find(x=>x.id===id); if(!f)return;
  f.payees++; f.dernierMois=moisCourant();
  D.ops.unshift({id:uid(),type:'out',montant:f.total/f.nb,
    libelle:f.libelle+' ('+f.payees+'/'+f.nb+')',compteId:f.compteId,date:auj()});
  maj();
}
function deCote(id,m){
  const g=D.goals.find(x=>x.id===id); if(!g)return;
  g.epargne=Math.max(0,g.epargne+m); maj();
}
function renomme(id,v){const c=D.comptes.find(x=>x.id===id);if(c){c.nom=v;sauver();}}
function initial(id,v){const c=D.comptes.find(x=>x.id===id);if(c){c.soldeInitial=nb(v);maj();}}
function nouveauCompte(){
  D.comptes.push({id:uid(),nom:'Nouveau compte',soldeInitial:0,couleur:COUL[D.comptes.length%6]});maj();
}
function toutEffacer(){ if(confirm('Tout effacer et repartir de zéro ?')){D=structuredClone(VIDE);maj();} }

function exemple(){
  const n=new Date(), j=x=>new Date(n.getFullYear(),n.getMonth(),x).toISOString().slice(0,10);
  D={comptes:[{id:'c1',nom:'Compte courant',couleur:'#4F3FF0',soldeInitial:320},
              {id:'c2',nom:'Livret épargne',couleur:'#00B8D9',soldeInitial:1500}],
     ops:[{id:uid(),type:'in',montant:1850,libelle:'Salaire',compteId:'c1',date:j(2)},
          {id:uid(),type:'in',montant:120,libelle:'Remboursement Léa',compteId:'c1',date:j(9)},
          {id:uid(),type:'out',montant:96.4,libelle:'Courses',compteId:'c1',date:j(5)},
          {id:uid(),type:'out',montant:42,libelle:'Essence',compteId:'c1',date:j(11)},
          {id:uid(),type:'out',montant:28.9,libelle:'Restaurant',compteId:'c1',date:j(14)}],
     recs:[{id:uid(),libelle:'Loyer',montant:620,jour:5,compteId:'c1',dernierMois:null},
           {id:uid(),libelle:'Forfait mobile',montant:19.99,jour:8,compteId:'c1',dernierMois:null},
           {id:uid(),libelle:'Électricité',montant:74,jour:15,compteId:'c1',dernierMois:null}],
     fours:[{id:uid(),libelle:'Casque audio',total:240,nb:4,payees:1,compteId:'c1',dernierMois:null},
            {id:uid(),libelle:'Pneus voiture',total:460,nb:4,payees:2,compteId:'c1',dernierMois:null}],
     goals:[{id:uid(),nom:'Vacances été',cible:900,epargne:350,couleur:'#F5B301'},
            {id:uid(),nom:'Nouveau vélo',cible:600,epargne:120,couleur:'#12B76A'}]};
  maj();
}

/* ------------------------------------------------ rendu */
function ligne(ico,fond,coul,nom,det,droite){
  return `<div class="ligne"><span class="ico" style="background:${fond};color:${coul}">${ico}</span>
    <div class="txt"><div class="nom">${esc(nom)}</div><div class="det">${esc(det)}</div></div>
    <div style="font-size:15px;white-space:nowrap">${droite}</div></div>`;
}

function vueAccueil(){
  const k=calc();
  const segs=[['Récurrents',k.mRec,'var(--rec)'],['Paiements 4x',k.mFour,'var(--four)'],
    ['Épargne mise de côté',k.epargne,'var(--goal)'],['Reste à vivre',Math.max(0,k.resteAVivre),'var(--reste)']]
    .filter(s=>s[1]>0);
  const tot=segs.reduce((s,x)=>s+x[1],0)||1;

  let h=`<div class="fade"><div class="eyebrow">Mon budget</div>
    <div class="titre">${k.total>=0?'Où en est mon argent':'Attention au découvert'}</div>`;

  if(rienDedans()) h+=`<div class="carte" style="background:var(--reste);color:#fff">
    <div style="font-weight:800;font-size:17px;margin-bottom:4px">Commence par ton solde</div>
    <div style="font-size:14px;opacity:.9;margin-bottom:14px;line-height:1.45">
      Renseigne ce que tu as sur tes comptes dans l'onglet Comptes, puis ajoute tes revenus et tes dépenses.</div>
    <button class="btn" style="background:rgba(255,255,255,.16)" onclick="exemple()">Voir avec des données d'exemple</button></div>`;

  h+=`<div class="carte" style="padding:20px">
    <div class="eyebrow">Il te reste vraiment</div>
    <div class="gros ${k.resteAVivre<0?'negatif':''}">${eur(k.resteAVivre)}</div>
    <div class="sous" style="margin-bottom:16px">sur ${eur(k.total)} disponibles, une fois tes engagements du mois retirés</div>
    <div class="jauge">${segs.map(s=>`<div style="width:${s[1]/tot*100}%;background:${s[2]}"></div>`).join('')}</div>
    <div style="margin-top:14px">${segs.length?segs.map(s=>
      `<div class="leg"><span class="pastille" style="background:${s[2]}"></span>
       <span style="flex:1;color:var(--soft)">${s[0]}</span><strong>${eur(s[1])}</strong></div>`).join('')
      :'<div class="vide">Ajoute un solde ou une opération pour voir la répartition.</div>'}</div>
    ${k.resteAVivre<0?`<div class="alerte">Tes engagements dépassent ce que tu as. Il manque ${eur(Math.abs(k.resteAVivre))}.</div>`:''}
  </div>`;

  const mv=moisVu();
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px">
    <button class="fermer" style="background:#fff" onclick="moisPrec()">${SVG.gauche}</button>
    <div style="font-weight:800;font-size:15px">${MOIS[mv.getMonth()].replace('.','')} ${mv.getFullYear()}</div>
    <button class="fermer" style="background:#fff;opacity:${dec>=0?.35:1}" onclick="moisSuiv()">${SVG.droite}</button></div>`;

  h+=`<div class="duo" style="margin-bottom:10px">
    <div class="carte" style="padding:14px;margin:0"><span style="color:var(--in)">${SVG.bas}</span>
      <div class="chiffre">${eurC(k.totalIn)}</div><div class="eyebrow">Rentré</div></div>
    <div class="carte" style="padding:14px;margin:0"><span style="color:var(--out)">${SVG.haut}</span>
      <div class="chiffre">${eurC(k.totalOut)}</div><div class="eyebrow">Dépensé</div></div></div>`;

  /* graphique 6 mois */
  const hist=[];let max=1;
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const c=cleMois(d),o=D.ops.filter(x=>x.date.slice(0,7)===c);
    const e=o.filter(x=>x.type==='in').reduce((s,x)=>s+x.montant,0);
    const p=o.filter(x=>x.type==='out').reduce((s,x)=>s+x.montant,0);
    max=Math.max(max,e,p);hist.push([MOIS[d.getMonth()].replace('.',''),e,p]);
  }
  h+=`<div class="carte"><div class="eyebrow">6 derniers mois</div><div id="graph">${
    hist.map(m=>`<div class="col"><div class="paire">
      <i style="height:${m[1]/max*100}%;background:var(--in)"></i>
      <i style="height:${m[2]/max*100}%;background:var(--out)"></i></div>
      <div class="m">${m[0]}</div></div>`)
